name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Package source
        run: |
          git archive --format=tar.gz --prefix=TenTenV/ HEAD -o TenTenV-source.tar.gz
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: TenTenV-source
          path: TenTenV-source.tar.gz

  windows-desktop:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Build client and workspace packages
        run: |
          npm run build -w @tentenv/protocol -w @tentenv/sdk
          npm run build -w @tentenv/client
      - name: Build native OpenXR addon
        run: npm run build:native -w @tentenv/desktop
      - name: Package Windows desktop
        run: npm run package -w @tentenv/desktop
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: TenTenV-win32-x64
          path: |
            apps/desktop/dist/TenTenV-win32-x64.zip
          if-no-files-found: error

  publish:
    needs: [verify, windows-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release
          find release-assets -type f -exec cp {} release/ \;
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; updating it."
            existing_notes="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""')"
            generated_notes="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG_NAME" --jq '.body')"
            marker="<!-- generated release notes for $TAG_NAME -->"

            if [[ -n "$generated_notes" && "$existing_notes" != *"$marker"* ]]; then
              if [[ -n "$existing_notes" ]]; then
                updated_notes="$(printf '%s\n\n%s\n%s' "$existing_notes" "$marker" "$generated_notes")"
              else
                updated_notes="$(printf '%s\n%s' "$marker" "$generated_notes")"
              fi
              gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --notes "$updated_notes"
            fi

            gh release upload "$TAG_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "$TAG_NAME" --generate-notes
          fi
