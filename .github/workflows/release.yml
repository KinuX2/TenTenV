name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Package source
        run: |
          git archive --format=tar.gz --prefix=TenTenV/ HEAD -o TenTenV-source.tar.gz
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: TenTenV-source
          path: TenTenV-source.tar.gz

  windows-desktop:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Build client and workspace packages
        run: |
          npm run build -w @tentenv/protocol -w @tentenv/sdk
          npm run build -w @tentenv/client
      - name: Build native OpenXR addon
        run: npm run build:native -w @tentenv/desktop
      - name: Package Windows desktop
        run: npm run package -w @tentenv/desktop
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: TenTenV-win32-x64
          path: |
            apps/desktop/dist/TenTenV-win32-x64.zip
          if-no-files-found: error

  publish:
    needs: [verify, windows-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release
          find release-assets -type f -exec cp {} release/ \;
          gh release create "$TAG_NAME" release/* --title "$TAG_NAME" --generate-notes
